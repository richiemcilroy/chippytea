name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_integration_tests:
        description: Run native tests that use disposable files and real Trash
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust and macOS build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CHIPPYTEA_SIGNING_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
          swift --version
          xcodebuild -version
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test Rust
        run: env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR cargo test --locked
      - name: Test release validation offline
        run: python3 scripts/release/test_release.py
      - name: Build and verify the ad-hoc signed app
        run: ./scripts/build.sh
      # Checks local policy and bundle configuration, not release signing or a live update.
      - name: Test update policy and bundle configuration
        run: env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR build/chippytea.app/Contents/MacOS/chippytea --update-self-test
      # These tests observe real APFS free space and native system services.
      # Run them deliberately; they are not a portable reward or TCC guarantee.
      - name: Run disposable native integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.native_integration_tests
        run: |
          env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR build/chippytea.app/Contents/MacOS/chippytea --self-test
          env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR build/chippytea.app/Contents/MacOS/chippytea --access-flow-test

  site:
    name: Website build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test download routing
        run: node --test tests/download.test.mjs
      - name: Test karaoke particle lifecycle
        run: bun test tests/karaoke-scene.test.mjs
      - name: Check generated README artwork
        working-directory: .
        run: bun scripts/generate-readme-art.ts --check
      - name: Build the website
        run: bun run build
