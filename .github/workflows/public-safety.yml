name: Public safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private files and local output
        run: |
          python3 scripts/check-public-files.py --self-test
          python3 scripts/check-public-files.py
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Compare both pins with the upstream release before updating.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          gitleaks_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$gitleaks_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output "$gitleaks_dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$gitleaks_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$gitleaks_dir/gitleaks.tar.gz" -C "$gitleaks_dir" gitleaks
          printf '%s\n' "$gitleaks_dir" >> "$GITHUB_PATH"
      - name: Scan reachable Git history
        run: gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts=--all .
      - name: Scan the checked-out files
        run: gitleaks dir --redact=100 --no-banner --ignore-gitleaks-allow .
